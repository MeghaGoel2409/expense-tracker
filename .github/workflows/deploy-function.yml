name: Deploy Expense Export Function

on:
  push:
    branches:
      - main
    paths:
      - "expense-tracker-functions/src/ExpenseTracker.Functions/**"
      - "expense-tracker-api/src/ExpenseTracker.Application/**"
      - "expense-tracker-api/src/ExpenseTracker.Domain/**"
      - "expense-tracker-api/src/ExpenseTracker.Infrastructure/**"
      - ".github/workflows/deploy-function.yml"
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: func-expense-export
  FUNCTION_PROJECT_PATH: expense-tracker-functions/src/ExpenseTracker.Functions/ExpenseTracker.Functions.csproj
  PUBLISH_DIRECTORY: ${{ github.workspace }}/function-publish
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore Function project
        run: dotnet restore "${{ env.FUNCTION_PROJECT_PATH }}"

      - name: Publish Function project
        run: >
          dotnet publish "${{ env.FUNCTION_PROJECT_PATH }}"
          --configuration Release
          --output "${{ env.PUBLISH_DIRECTORY }}"
          --no-restore

      - name: Deploy Function App
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.PUBLISH_DIRECTORY }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
          sku: flexconsumption
